<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Винил</title>
    <link rel="stylesheet" href="stylesheets/vinyl.css" />
    <link rel="stylesheet" href="stylesheets/style.css" />
    <script defer src="javascripts/scripts.js"></script>
    <script defer src="javascripts/vinyl.js"></script>
    <script defer src="javascripts/scramble-text.js"></script>
  </head>
  <body>
    <div class="cursor"></div>
    <nav class="mainMenu">
      <button class="burgerBtn" type="button">
        <span></span>
        <span></span>
      </button>
    
      <a href="vinyl.html" class="active">винил</a>
      <a href="order.html">магазин</a>
      <a href="index.html"><img src="images/logomini.svg" alt="Логотип" /></a>
      <a href="music.html">музыка</a>
      <a href="bar.html">бар</a>
    </nav>
    <section class="sectionVinyl">
      <img class="title" src="images/VINYL.svg" alt="">
      <div class="blob blob-v1"></div>
      <div class="blob blob-v2"></div>
      
      <div class="blob blob-v3"></div>
      <div class="blob blob-v4"></div>
      <section class="vinyl-section">
        <!-- ===== СЛАЙДЕР ===== -->
        <div class="vinyl-slider">
          <button class="prev">
            <img src="images/arrow.svg" alt="Назад">
          </button>
      
          <div class="records" id="recordsContainer">
            <!-- Пластинки будут вставлены скриптом -->
          </div>
      
          <button class="next">
            <img src="images/arrow.svg" alt="Вперед">
          </button>
        </div>
      
        <!-- ===== ИНФОРМАЦИЯ ===== -->
        <div class="record-info" id="recordInfo">
          <h2 class="record-title">(НОЧЬ)</h2>
          <h2 class="record-title">пластинка</h2>
          <p class="record-price">10.000 руб</p>
        </div>
      
        <!-- Точки пагинации -->
        <div class="dots" id="dotsContainer"></div>
      </section>
      <section class="videos">
        <div class="textlalala">ПРОЦЕСС СОЗДАНИЯ</div>
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 2vw;">
          
          <!-- ОБЕРТКА ВИДЕО + КНОПКА -->
          <div class="video-wrapper" style="margin: 0 auto;">
            
            <!-- ВИДЕО -->
            <video
              id="vinylVideo"
              class="hero-video"
              playsinline
              style="display: block; width: 100%; height: auto; margin: 0 auto;"
            >
              <source src="videos/vinyl.mov" type="video/mp4">
              Ваш браузер не поддерживает видео.
            </video>
  
            <!-- БЕЛАЯ КНОПКА ПО ЦЕНТРУ -->
            <div class="center-btn" id="centerBtn">
              <svg viewBox="0 0 100 100">
                <!-- Треугольник (Play) -->
                <polygon id="playIcon" points="35,20 35,80 75,50" fill="white"/>
                <!-- Две палки (Pause) -->
                <rect id="pauseIcon" x="30" y="20" width="14" height="60" fill="white" rx="2" style="display:none"/>
                <rect id="pauseIcon2" x="56" y="20" width="14" height="60" fill="white" rx="2" style="display:none"/>
              </svg>
            </div>
      
          </div>
      
          <!-- ПОЛОСА ПРОГРЕССА (ОДНА) -->
          <div class="progress-wrapper">
            <div class="progress-track">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
      
        </div>
      </section>
   <section class="contacts">
    <div class="contacts2stolba">
      <div class="contacts-column">
        <h3>Получать новости:</h3>
        <span class="placeholder">
          <input type="email" name="email" value="" placeholder=""/>
          <button type="submit" class="send-btn">
            <img src="images/arrow.svg" alt="">
          </button>
        </span>
      </div>

      <div class="contacts-column">
        <h3>Как нас найти:</h3>
        <p>Адрес: М.Павлецкая 123</p>
      </div>
    </div>
    <div class="contacts-footer">
      <span>Москаленко Ксения</span>
      <span>Б25Д311</span>
    </div>
   </section>
   
  </body>
</html>
